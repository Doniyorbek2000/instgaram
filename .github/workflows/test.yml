name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testlar
        run: npm test
      - name: Bog'liqliklar zaifligi (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Docker image build
        run: docker build -t obunext-ci .
