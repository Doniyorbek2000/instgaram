services:
  bot:
    build: .
    restart: unless-stopped
    # Deploy paytida jarayondagi xabarlar tugatilishi uchun (src/index.js shutdown)
    stop_grace_period: 25s
    ports:
      - "127.0.0.1:3015:3015"
    env_file:
      - .env
    environment:
      PG_HOST: postgres
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
