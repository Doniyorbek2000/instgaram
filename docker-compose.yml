services:
  bot:
    build: .
    image: instagram-bot:latest
    restart: unless-stopped
    # Deploy paytida jarayondagi xabarlar tugatilishi uchun (src/index.js shutdown)
    stop_grace_period: 25s
    ports:
      - "127.0.0.1:3015:3015"
    env_file:
      - .env
    environment:
      PG_HOST: postgres
      PORT: 3015
    # Kod faqat image ichida (deploy build qiladi) — src/ papkasi ulanmaydi,
    # aks holda ishlayotgan kod image'dagidan farq qilib qolardi.
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  pgdata:
